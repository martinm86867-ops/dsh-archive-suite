name: "web-mirror-pipeline"
description: "Crawl Wayback CDX snapshots, download HTML captures, extract clean text, and store in SQLite"
concurrency: 3
batch_size: 10
max_items: 10
resume: true
state_db: "./data/pipeline_state.db"

source:
  type: "cdx"
  name: "example_cdx_crawl"
  params:
    url: "http://example.com"
    match_type: "exact"
    limit: 10
    status_codes: [200]
    collapse: "digest"

transforms:
  - type: "download"
    name: "snapshot_downloader"
    params:
      raw: true
      destination_dir: "./data/mirrors"
  - type: "html_text"
    name: "extract_clean_text"
    params: {}

sinks:
  - type: "sqlite"
    name: "snapshot_archive_db"
    params:
      db_path: "./data/wayback_snapshots.db"
      table: "snapshots"
  - type: "console"
    name: "terminal_log"
    params: {}
